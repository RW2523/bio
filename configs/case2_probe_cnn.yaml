inherits: ["data.yaml", "preprocess.yaml", "cnn_model.yaml"]

experiment_name: "case2_augpred_frozen_probe_cnn"

epochs: 50
batch_size: 64
num_workers: 4
compute_device: "cuda"

probe_optimizer: "adamw"
lr: 0.002
weight_decay: 0.01
lr_scheduler: "cosine"
lr_min_ratio: 0.02
max_grad_norm: 1.0
label_smoothing: 0.05
class_balanced_loss: true
probe_embedding_batchnorm: true

pretrained_backbone_path: "outputs/checkpoints/cnn_ssl/backbone_best.pt"

checkpoint_subdir: "checkpoints/cnn_case2"
seed: 42
