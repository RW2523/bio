inherits: ["data.yaml", "preprocess.yaml", "model.yaml", "case2_probe.yaml"]

experiment_name: "case2_ssl_then_e2e_finetune"

epochs: 30
batch_size: 32
num_workers: 4
compute_device: "cuda"

probe_optimizer: "adamw"
lr: 0.001
backbone_lr_ratio: 0.05
weight_decay: 0.0001
lr_scheduler: "cosine"
lr_min_ratio: 0.05
max_grad_norm: 1.0
label_smoothing: 0.05
class_balanced_loss: true
probe_embedding_batchnorm: true

best_checkpoint_metric: "val_acc"
pretrained_backbone_path: "outputs/checkpoints/ssl/backbone_best.pt"
checkpoint_subdir: "checkpoints/case2_e2e_finetune"
seed: 42
