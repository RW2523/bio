inherits: ["data.yaml", "preprocess.yaml", "model.yaml", "case2_probe.yaml"]

experiment_name: "case2_ssl_then_e2e_finetune"

epochs: 30
batch_size: 32
num_workers: 4
compute_device: "cuda"

probe_optimizer: "adamw"
# Single-lr fallback if backbone_lr / head_lr are omitted.
lr: 0.001
head_lr: 0.001
backbone_lr: 0.0001
backbone_lr_ratio: 0.05
weight_decay: 0.0001
lr_scheduler: "cosine"
lr_min_ratio: 0.05
max_grad_norm: 1.0
label_smoothing: 0.05
class_balanced_loss: true
probe_embedding_batchnorm: true

best_checkpoint_metric: "val_macro_f1"
early_stop_patience: 10

# Classifier head: linear (default) or mlp (two-layer MLP + dropout).
classifier_head: linear
classifier_dropout: 0.3

# Optional motion-weighted CE (per-batch normalized motion weights).
motion_loss_weighting: false
motion_loss_alpha: 1.0

# Fine-tune block (optional; top-level head_lr/backbone_lr/weight_decay still apply if omitted).
finetune:
  unfreeze_backbone: true
  backbone_lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.0001
  early_stop_metric: macro_f1

pretrained_backbone_path: "outputs/checkpoints/ssl/backbone_best.pt"
checkpoint_subdir: "checkpoints/case2_e2e_finetune"
seed: 42
