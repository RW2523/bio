# Continuous Conv1D ResNet baseline. Keep this contract aligned with model.yaml
# where possible so CNN and SNN comparisons differ mainly by activation dynamics.
input_layout: "BCT"
backbone_type: "cnn_resnet1d"

sensor_channels: 3
feature_stack: ["raw"]
# mean | adaptive + pool_bins | adaptive4 | attention (same semantics as model.yaml)
pooling: mean
pool_bins: 1

classifier_head: linear
classifier_dropout: 0.3

debug:
  log_spike_rate: false
  log_grad_norm: false

in_channels: 3
base_channels: 32
layers: [1, 1, 2]
stem_kernel: 7

num_classes: 18
